<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b30">
  <title>جزيرة المعادي | تحميل التطبيق</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      color: white;
      background: #123b30;
    }

    .hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      background:
        linear-gradient(
          180deg,
          rgba(0, 20, 14, 0.25),
          rgba(0, 25, 18, 0.88)
        ),
        url("https://lookaside.fbsbx.com/lookaside/crawler/media/?media_id=445320334520815");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      width: 100%;
      max-width: 480px;
      padding: 30px 22px;
      background: rgba(9, 39, 29, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 10px 0 16px;
      font-size: 30px;
      line-height: 1.6;
      color: #f4d58b;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
      margin: 10px 0;
    }

    .phone {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(244, 213, 139, 0.6);
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      direction: rtl;
    }

    .download {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 17px 12px;
      border-radius: 14px;
      background: #f0cf7b;
      color: #153b2d;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .download:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 16px;
      color: #eeeeee;
      font-size: 13px;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #e4e9e5;
    }
  </style>
</head>

<body>
  <main class="hero">
    <section class="content">
      <div class="logo">🌴</div>

      <h1>مرحباً بكم في جزيرة المعادي</h1>

      <p>
        استمتعوا بأجواء الطبيعة والاستجمام على ضفاف النيل.
      </p>

      <p>
        حمّلوا التطبيق واكتشفوا جزيرة المعادي من موبايلكم.
      </p>

      <div class="phone">
        ☎ للاستعلامات: 0225282620
      </div>

      <a
        class="download"
        href="https://drive.google.com/uc?export=download&amp;id=1B8ddp1VufGxFRPXLQBybRZxGcqodhptz"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⬇ تحميل التطبيق للأندرويد
      </a>

      <div class="note">
        تطبيق أندرويد • اضغط على الزر لبدء التحميل
      </div>

      <footer>
        © جزيرة المعادي
      </footer>
    </section>
  </main>
</body>
</html>
